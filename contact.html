<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Vee Igwebuike</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
  <div class="container nav-container">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <a href="/" class="logo">Vee<span>.Portfolio</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">&#9776;</button>
    <nav aria-label="Main Navigation">
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About Me</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/planner">Academic Planner</a></li>
        <li><a href="/contact"class="active">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

  <main class="container page-content fade-in">
    <h1>Contact Me</h1>
    <p class="section-intro">  Send a message below.</p>

    <section class="card contact-card">
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
          <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="emailAddress">Email Address</label>
          <input type="email" id="emailAddress" name="emailAddress" placeholder="e.g., student@miva.edu.ng">
          <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number (Digits Only)</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g., 08012345678">
          <small class="error-msg" id="phoneError"></small>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
          <small class="error-msg" id="messageError"></small>
        </div>

        <button type="submit" class="btn btn-primary">Send Message</button>
        <div id="formFeedback" class="form-feedback" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy;  Vee Igwebuike </p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
